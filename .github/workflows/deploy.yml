name: Deploy Backend to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/live-chat-app/live-chat-server
            git fetch origin main
            git reset --hard origin/main
            npm install
            pm2 restart live-chat-server || pm2 start server.js --name live-chat-server
            pm2 save